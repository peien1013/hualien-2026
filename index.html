/* ============================================================ */
/* 🎫 車票共用                                                   */
/* ============================================================ */
.ticket {
  position: relative;
  box-sizing: border-box;
  width: 100%; max-width: 540px;
  margin: 12px auto;
  aspect-ratio: 2 / 1;
  border-radius: 16px;
  overflow: hidden;
  padding: 14px 22px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 6px;
}
.ticket .head {
  position: relative; z-index: 2;
  display: flex; justify-content: space-between; align-items: flex-start;
}
.ticket .head-left {
  display: flex; flex-direction: column;
  font-size: 17px; color: #333; font-weight: 700; letter-spacing: 1px;
  line-height: 1.5;
  flex: 1 1 auto; min-width: 0;   /* 讓車種車次有明確寬度可縮 */
}
.ticket .head-left .date-line { white-space: nowrap; overflow: hidden; }
.ticket .head-left .type-line {
  font-size: 27px; font-weight: 900; letter-spacing: 0.5px;
  white-space: nowrap; overflow: hidden;   /* 不換行，太長改用自動縮小 */
}
.ticket .fare-tag {
  background: #1a1a1a; color: #fff;
  padding: 5px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 700; letter-spacing: 2px;
  white-space: nowrap; flex-shrink: 0;     /* 票種標籤不被擠壓換行 */
}

/* ============================================================
   GitHub Pages 版相容層
   把原本的 google.script.run.xxx() 自動轉成 JSONP 呼叫 Apps Script。
   好處：前台其他程式碼完全不用改，維護時兩邊一致。
   為什麼要搬：Apps Script 網頁包在跨網域 iframe 裡，
   Facebook / LINE / IG 的內建瀏覽器會擋掉 → 客人看到一片空白。
   ============================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycbwlWbZzxvpgdG6CU9LS4bczYSzgpM9cxd8-CJWTbKtxJvFM3nX05Dk_5NrAaE2gK7SN/exec";

function jsonp_(params, onOk, onErr) {
  var cbName = "cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
  var script = document.createElement("script");
  var done = false;

  function cleanup() {
    try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[cbName] = function (data) {
    if (done) return;
    done = true;
    cleanup();
    onOk(data);
  };

  script.onerror = function () {
    if (done) return;
    done = true;
    cleanup();
    onErr({ message: "連線失敗，請檢查網路後再試一次" });
  };

  // 20 秒沒回應就當逾時
  setTimeout(function () {
    if (done) return;
    done = true;
    cleanup();
    onErr({ message: "連線逾時，請稍後再試" });
  }, 20000);

  var qs = [];
  for (var k in params) {
    if (params[k] === undefined || params[k] === null) continue;
    qs.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
  }
  qs.push("callback=" + cbName);
  script.src = API_URL + "?" + qs.join("&");
  document.body.appendChild(script);
}

var google = { script: {} };
Object.defineProperty(google.script, "run", {
  get: function () {
    var okCb = null, errCb = null;

    function send(params) {
      jsonp_(params,
        function (data) { if (okCb) okCb(data); },
        function (err)  { if (errCb) errCb(err); });
    }

    var api = {
      withSuccessHandler: function (f) { okCb = f; return api; },
      withFailureHandler: function (f) { errCb = f; return api; },

      searchName:          function (name) { send({ action: "search",   name: name }); },
      getProgressInfo:     function ()     { send({ action: "progress" }); },
      confirmUser:         function (n, d, r)    { send({ action: "confirm", name: n, days: d, roommates: r }); },
      saveMessage:         function (n, d, r, m) { send({ action: "message", name: n, days: d, roommates: r, message: m }); },
      findIncompleteRooms: function (f)    { send({ action: "rooms", daysFilter: f || "" }); }
    };
    return api;
  }
});

    if (!p || !p.show) { document.getElementById("progressBox").innerHTML = ""; return; }
    var html = "<div class='progress-box'>" +
      "<div class='p-title'>" + escapeHtml(p.title) + "</div>" +
      (p.content ? "<div class='p-content'>" + escapeHtml(p.content) + "</div>" : "") +
      "<div class='p-stats'>" +
        "<div class='p-stat'><div class='num'>" + p.total + "</div><div class='lbl'>總報名</div></div>" +
        "<div class='p-stat'><div class='num'>" + p.confirmed + "</div><div class='lbl'>已確認</div></div>" +
        "<div class='p-stat'><div class='num'>" + p.paid + "</div><div class='lbl'>已繳費</div></div>" +
      "</div>" +
    "</div>";
    document.getElementById("progressBox").innerHTML = html;
  }).withFailureHandler(function() {

// ============== 工具 ==============
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escapeAttr(s) { return escapeHtml(s); }

}
function searchAs(name) {
  document.getElementById("name").value = name;
  window.scrollTo({ top: 0, behavior: "smooth" });
  search();
}
function tba(text) { return "<span class='tba'>" + escapeHtml(text) + "</span>"; }

function getTicketStyle(type) {
  type = String(type || "").toLowerCase();
  if (type.indexOf("遊覽車") >= 0 || type.indexOf("bus") >= 0) return "bus";
  if (type.indexOf("高鐵") >= 0 || type.indexOf("hsr") >= 0) return "hsr";
  return "tra"; // 台鐵 / 自強 / 區間 / 莒光 等
}

function getFareTagClass(fare) {
  fare = String(fare || "");
  if (fare.indexOf("孩童") >= 0) return "child";
  if (fare.indexOf("敬老") >= 0) return "senior";
  if (fare.indexOf("愛心陪同") >= 0) return "love-companion";
  if (fare.indexOf("愛心") >= 0) return "love";
  if (fare.indexOf("成人") >= 0 || fare.indexOf("全票") >= 0) return "adult";
  return "";
}

function calcDuration(start, end) {
  if (!start || !end) return "";
  function parseHM(s) {
    var m = String(s).match(/(\d{1,2})[:：](\d{1,2})/);
    return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
  }
  var s = parseHM(start), e = parseHM(end);
  if (s === null || e === null) return "";
  var diff = e - s;
  if (diff < 0) diff += 24 * 60;
  var h = Math.floor(diff / 60), m = diff % 60;
  if (h && m) return h + "h " + m + "min";
  if (h) return h + "h";
  return m + "min";
}

// 用關鍵字判斷飯店（碧海/藍天、慈惠/聖地/香客、長榮/鳳凰/礁溪）
function hotelKeyword_(s) {
  s = String(s || "");
  if (/碧海|藍天|Ocean|Hyaline/i.test(s)) return "碧海";
  if (/慈惠|聖地|香客/.test(s)) return "慈惠";
  if (/長榮|鳳凰|礁溪|Evergreen/i.test(s)) return "長榮";
  return "";
}

function getHotelInfo(hotelName) {
  if (!hotelName) return null;
  hotelName = String(hotelName);
  var targetKey = hotelKeyword_(hotelName);

  for (var i = 1; i <= 3; i++) {
    var name = SETTINGS["飯店" + i + "中文名"];
    if (!name) continue;
    // 1) 直接包含 2) 關鍵字相同（兩者都有就算同一家）
    var match = (hotelName.indexOf(name) >= 0 || name.indexOf(hotelName) >= 0);
    if (!match && targetKey && hotelKeyword_(name) === targetKey) match = true;
    if (match) {
      return {
        id: i,
        style: String(SETTINGS["飯店" + i + "風格"] || "A").toLowerCase(),
        nameCn: name,
        nameEn: SETTINGS["飯店" + i + "英文名"] || "",
        stamp: SETTINGS["飯店" + i + "印章字"] || "",
        address: SETTINGS["飯店" + i + "地址"] || "",
        phone: SETTINGS["飯店" + i + "電話"] || ""
      };
    }
  }
  return null;
}

// ============== 主流程 ==============
function search() {
  var name = document.getElementById("name").value.trim();
  var resultEl = document.getElementById("result");

  if (name === "") {
    resultEl.innerHTML = "<div class='notice'>請先輸入姓名喔</div>";
    return;
  }

  // 查個人時把「查詢缺人房間」按鈕、進度公告收起來，畫面乾淨
  var roomsArea = document.getElementById("roomsBtnArea");
  if (roomsArea) roomsArea.style.display = "none";
  var pBox = document.getElementById("progressBox");
  if (pBox) pBox.style.display = "none";

  resultEl.innerHTML = "<div class='notice'><span class='spinner'></span>查詢中，請稍候...</div>";

  google.script.run.withSuccessHandler(function(data) {
    if (!data) {
      resultEl.innerHTML = "<div class='notice'>查無資料，請確認姓名是否正確</div>";
      return;
    }
    if (data.type === "error") {
      resultEl.innerHTML = "<div class='notice'>⚠ " + escapeHtml(data.message) + "</div>";
      return;
    }
    if (data.settings) SETTINGS = data.settings;
    if (data.dates) DATES = data.dates;
    if (data.schedule) SCHEDULE = data.schedule;

    if (data.type === "notfound") {
      renderNotFound(data.suggestions || []);
      return;
    }
    if (data.type === "found") {
      if (data.records.length === 1) renderRecord(data.records[0]);
      else renderChoose(data.records);
    }
  }).withFailureHandler(function(err) {
    resultEl.innerHTML = "<div class='notice'>⚠ 查詢失敗：" + escapeHtml(err.message || err) + "</div>";
  }).searchName(name);
}

function renderNotFound(suggestions) {
  var html = "<div class='notice'>查無「" +
    escapeHtml(document.getElementById("name").value.trim()) + "」這位的資料。</div>";
  if (suggestions.length > 0) {
    html += "<div class='card'><div class='block-title'>你是不是要找：</div><div style='text-align:center'>";
    suggestions.forEach(function(s) {
      html += "<span class='suggest-chip' onclick=\"searchAs('" +
        escapeAttr(s).replace(/'/g, "\\'") + "')\">" + escapeHtml(s) + "</span>";
    });
    html += "</div></div>";
  }
  document.getElementById("result").innerHTML = html;
}

function renderChoose(records) {
  var html = "<div class='notice'>找到 " + records.length + " 位同名的人，請選擇你是哪一位：</div>";
  records.forEach(function(r, idx) {
    html += "<div class='choose-card' onclick='pickRecord(" + idx + ")'>" +
      "<div class='ch-name'>👤 " + escapeHtml(r.name) + "</div>" +
      "<div class='ch-meta'>📅 " + escapeHtml(r.days || "未填") +
      " ｜ 🌱 同住：" + escapeHtml(r.roommates || "未填寫") + "</div></div>";
  });
  document.getElementById("result").innerHTML = html;
  window._sameNameRecords = records;
}
function pickRecord(idx) {
  var r = window._sameNameRecords && window._sameNameRecords[idx];
  if (r) renderRecord(r);
}

// ============== 渲染：主卡 ==============
function renderRecord(data) {
  currentRecord = data;

  var isTwoDay = String(data.days || "").indexOf("兩天一夜") >= 0;

  // 繳費（已繳費 / 已付現 / 已轉帳 / 繳清… 都算已繳；後面可接日期金額）
  var isPaid = /已繳|已付|已轉|繳清|完成/.test(String(data.paid || ""));
  var paidClass = "unpaid";
  if (isPaid) paidClass = "paid";
  else if (/部分/.test(data.paid)) paidClass = "partial";
  var paidDisplay = data.paid
    ? "<span class='" + paidClass + "'>" + escapeHtml(data.paid) + "</span>"
    : "—";
  var payNotice = "";  // 繳費提示移到「確認後」才出現（見 confirmBlockHtml）

  // 是否用漂亮卡片（已繳費 + 有新版車票資料）
  var hasNewTickets = data.tickets && data.tickets.some(function(t) {
    return t.type || t.no || t.car || t.seat;
  });
  var hasHotelSettings = SETTINGS["飯店1中文名"] || SETTINGS["飯店2中文名"] || SETTINGS["飯店3中文名"];
  var usePretty = isPaid && hasNewTickets;

  // 按天數分組組裝（漂亮版）
  var dayGroupedHtml = "";
  if (usePretty) {
    var t = data.tickets;  // [D1, D2, D3自強, D3高鐵]
    var aftDest = isTwoDay ? "宜蘭火車站" : "長榮礁溪飯店";

    // === 第一天 ===
    var day1 = "";
    day1 += renderTicket(t[0], t[0].dayLabel || "第一天", DATES.d1);
    day1 += renderShuttleCard("第一天接駁", data.shuttle, "花蓮 ▶ 勝安宮 ▶ 飯店");
    if (hasHotelSettings && data.hotel1) {
      day1 += renderRoomCard(data.hotel1, data.room1, data.roommates, 1, DATES.d1);
    }
    if (day1) dayGroupedHtml += "<div class='day-header'>📅 第一天　" + escapeHtml(DATES.d1) + "</div>" + day1;

    // === 第二天 ===
    var day2 = "";
    day2 += renderShuttleCard("第二天上午", data.shuttleMid, "飯店 ▶ 三清宮");
    day2 += renderShuttleCard("第二天下午", data.shuttleAft, "三清宮 ▶ " + aftDest);
    if (isTwoDay) {
      // 兩天一夜：第二天搭火車回家
      day2 += renderTicket(t[1], t[1].dayLabel || "第二天 回程", DATES.d2);
    } else {
      // 三天兩夜：第二夜房卡
      if (hasHotelSettings && data.hotel2) {
        day2 += renderRoomCard(data.hotel2, data.room2, (data.roommates2 || data.roommates), 2, DATES.d2);
      }
    }
    if (day2) dayGroupedHtml += "<div class='day-header'>📅 第二天　" + escapeHtml(DATES.d2) + "</div>" + day2;

    // === 第三天（只有三天兩夜）===
    if (!isTwoDay) {
      var day3 = "";
      day3 += renderTicket(t[2], t[2].dayLabel || "第三天 ‧ 自強號", DATES.d3);
      day3 += renderTicket(t[3], t[3].dayLabel || "第三天 ‧ 高鐵", DATES.d3);
      if (day3) dayGroupedHtml += "<div class='day-header'>📅 第三天　" + escapeHtml(DATES.d3) + "</div>" + day3;
    }
  }

  // 舊版 fallback（未繳費 / 沒新版資料）
  var legacyTransportHtml = renderLegacyTransport(data, isTwoDay);
  var legacyHotelsHtml = (data.hotel1 || data.hotel2) ? renderLegacyHotels(data, isTwoDay) : "";
  var legacyShuttleHtml = "";
  if (data.shuttle || data.shuttleMid || data.shuttleAft) {
    var aftDest2 = isTwoDay ? "宜蘭火車站" : "長榮礁溪飯店";
    var aftVal2 = data.shuttleAft
      ? escapeHtml(data.shuttleAft) + "<div style='font-size:18px;color:#7a4b1f;margin-top:6px;font-weight:600'>(→ " + escapeHtml(aftDest2) + ")</div>"
      : "—";
    legacyShuttleHtml = "<div class='info-block'><div class='grid-3'>" +
      infoBox("第1天接駁（花蓮↔勝安宮）", data.shuttle || "—") +
      infoBox("第2天上午（飯店→三清宮）", data.shuttleMid || "—") +
      "<div class='info-box'><div class='label'>第2天下午（三清宮後）</div><div class='value'>" + aftVal2 + "</div></div>" +
    "</div></div>";
  }

  // 上次留言
  var lastMsgHtml = "";
  if (data.lastMessage) {
    lastMsgHtml = "<div class='last-msg'>📜 上次留言：" + escapeHtml(data.lastMessage) +
      (data.lastMessageTime ? "<div class='ts'>" + escapeHtml(data.lastMessageTime) + "</div>" : "") +
      "</div>";
  }

  // 確認
  var isConfirmed = data.confirmed === "已確認";
  var confirmBlockHtml;
  if (isConfirmed) {
    confirmBlockHtml =
      "<div class='confirm-done'>✅ 已確認" +
      (data.confirmTime ? "<div class='ts'>" + escapeHtml(data.confirmTime) + "</div>" : "") +
      "</div>" +
      "<div class='confirm-next-step'>💌 請私訊主辦繳費</div>";
  } else {
    confirmBlockHtml =
      "<button class='big-confirm-btn' id='confirmBtn' onclick='confirmInfo()'>✅ 以上資訊無誤，按此送出</button>" +
      "<div class='confirm-hint'>住宿搭車金額確認無誤後，請按確認鍵，即可開始繳費 💰</div>";
  }

  // 三天兩夜 = 淺藍底 / 兩天一夜 = 淺黃底
  var colorClass = isTwoDay ? "yellow" : "blue";

  var html = "<div class='card " + colorClass + "'>" +
    "<div class='name-title'>👤 " + escapeHtml(data.name) + "</div>" +
    "<div style='text-align:center;margin-bottom:8px'>" +
      "<button class='back-btn' onclick='resetSearch()'>← 重新查詢</button>" +
    "</div>";

  if (usePretty) {
    // 已繳費 → 按天數分組顯示漂亮卡片
    html += dayGroupedHtml;
  } else {
    // 未繳費 / 沒新版資料 → 舊版 info-box 核對版
    html += "<div class='section-title'>🚌 接送資訊</div>" + legacyTransportHtml;
    if (legacyHotelsHtml) html += "<div class='section-title'>🏨 住宿</div>" + legacyHotelsHtml;
    if (legacyShuttleHtml) html += "<div class='section-title'>🚌 接駁遊覽車</div>" + legacyShuttleHtml;
    html += "<div class='info-block' style='text-align:center; padding:14px; color:#7a4b1f; background:#fff7e6; border:2px dashed #d4a017; font-weight:bold; line-height:1.7; font-size:17px; margin-top:10px'>" +
      "💰 上面是核對用資訊，完成繳費後會升級成正式的<br>" +
      "🎫 <b>車票</b> ／ 🏨 <b>房卡</b> ／ 🚌 <b>接駁車</b> 精緻卡片" +
      "</div>";
  }

  // 身分（用色塊區分：成人黑 / 孩童藍 / 敬老橘 / 愛心粉 / 愛心陪同紫）
  var typeTagClass = getFareTagClass(data.type);
  var typeDisplay = data.type
    ? "<span class='type-tag " + typeTagClass + "'>" + escapeHtml(data.type) + "</span>"
    : "—";

  // 身分 / 費用
  html += "<div class='section-title'>💰 身分 / 費用</div>" +
    "<div class='info-block'>" +
      "<div class='grid-3'>" +
        "<div class='info-box'>" +
          "<div class='label'>身分</div>" +
          "<div class='value'>" + typeDisplay + "</div>" +
        "</div>" +
        infoBox("須繳費用", data.fee) +
        "<div class='info-box'>" +
          "<div class='label'>繳費情況</div>" +
          "<div class='value'>" + paidDisplay + "</div>" +
        "</div>" +
      "</div>" +
      payNotice +
    "</div>";

  // 留言區（整個區塊預設隱藏，只顯示一個小按鈕）
  var msgBtnText = data.lastMessage
    ? "💬 查看 / 修改我的留言"
    : "💬 我要留言給主辦（選填）";

  html += "<div style='text-align:center; margin: 18px 0 0'>" +
    "<button class='msg-toggle-btn' onclick='toggleMessage()'>" + msgBtnText + "</button>" +
  "</div>";

  html += "<div id='messageBlock' class='block' style='display:none; margin-top:12px'>" +
    "<div class='block-title'>📝 客人留言</div>" +
    lastMsgHtml +
    "<textarea id='guestMessage' placeholder='若有需要調整或提醒事項，請在這裡留言'></textarea>" +
    "<button class='confirm-btn' id='msgBtn' onclick='sendMessage()'>送出留言</button>" +
  "</div>";

  // 確認區（最後步驟）
  html += "<div class='block'>" +
    confirmBlockHtml +
  "</div>";

  html += "</div>"; // close card

  document.getElementById("result").innerHTML = html;
  scheduleFit_();   // 站名／車次／座位 太長時自動縮到剛好
}

// 站名太長時，在「地名 / 站別」之間斷成兩行（不會斷在半個詞中間）
// 例：羅東火車站 → 羅東 ／ 火車站　　高雄左營高鐵站 → 高雄左營 ／ 高鐵站
function stationHtml_(name) {
  var s = String(name == null ? "" : name).trim();
  if (!s) return "—";
  var m = s.match(/^(.+?)(高鐵站|火車站|轉運站|客運站|車站|站)$/);
  if (m && m[1]) {
    return "<span class='st-place'>" + escapeHtml(m[1]) + "</span>" +
           "<span class='st-kind'>" + escapeHtml(m[2]) + "</span>";
  }
  return "<span class='st-place'>" + escapeHtml(s) + "</span>";
}

// ============== 車票卡文字自動縮放 ==============
// 站名（羅東火車站／高雄左營高鐵站…）長度不一，太長會被切掉。
// 這裡量測實際寬度，超出就一級一級縮小，直到塞得下為止。
function fitOne_(el, minPx) {
  if (!el) return;
  el.style.fontSize = "";                       // 先還原成 CSS 預設值再量
  var size = parseFloat(window.getComputedStyle(el).fontSize) || 20;
  var guard = 0;
  while (el.scrollWidth > el.clientWidth + 1 && size > minPx && guard++ < 60) {
    size -= 1;
    el.style.fontSize = size + "px";
  }
}

// 站名策略：① 先試一行 → ② 放不下就在「地名／站別」之間斷成兩行 → ③ 還是不夠才縮字
function fitStation_(el, minPx) {
  if (!el) return;
  el.classList.remove("two-line");
  el.style.fontSize = "";
  if (el.scrollWidth <= el.clientWidth + 1) return;      // ① 一行就夠了

  el.classList.add("two-line");                          // ② 斷詞成兩行
  if (el.scrollWidth <= el.clientWidth + 1) return;

  var size = parseFloat(window.getComputedStyle(el).fontSize) || 26;
  var guard = 0;                                         // ③ 仍太寬 → 縮字
  while (el.scrollWidth > el.clientWidth + 1 && size > minPx && guard++ < 60) {
    size -= 1;
    el.style.fontSize = size + "px";
  }
}

function fitTicketText() {
  var stations = document.querySelectorAll(".ticket .station-cn");
  for (var i = 0; i < stations.length; i++) fitStation_(stations[i], 15);

  var sel = [
    [".ticket .type-line",  14],
    [".ticket .seat-info",  13],
    [".room .name-cn",      14]
  ];
  sel.forEach(function(pair) {
    var list = document.querySelectorAll(pair[0]);
    for (var i = 0; i < list.length; i++) fitOne_(list[i], pair[1]);
  });
}

// 字型是網路載入的，載完寬度會變 → 再算一次
function scheduleFit_() {
  fitTicketText();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitTicketText).catch(function(){});
  }
  setTimeout(fitTicketText, 300);
}

// 轉螢幕方向／改變視窗大小也要重算
var _fitTimer = null;
window.addEventListener("resize", function() {
  clearTimeout(_fitTimer);
  _fitTimer = setTimeout(fitTicketText, 150);
});

function infoBox(label, value, extraHtml) {
  return "<div class='info-box'>" +
    "<div class='label'>" + escapeHtml(label) + "</div>" +
    "<div class='value'>" + escapeHtml(value || "—") + "</div>" +
    (extraHtml || "") +
    "</div>";
}

// 站名比對：完全相同，或互相包含（「高雄」也對得到「高雄火車站」）
function stationMatch_(a, b) {
  a = String(a == null ? "" : a).trim();
  b = String(b == null ? "" : b).trim();
  if (!a || !b) return false;
  if (a === b) return true;
  return a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}

// 依「天別 + 站名」找出該班車，組成要顯示在站名底下的 HTML
// dayKey = 第一天上車 / 第二天下車 / 第三天下車
function trainInfoHtml(dayKey, station) {
  if (!station || !SCHEDULE || !SCHEDULE.length) return "";
  var rows = SCHEDULE.filter(function(r) {
    return String(r.day || "").trim() === dayKey && stationMatch_(r.station, station);
  });
  if (!rows.length) return "";

  var html = "<div class='train-info'>";
  rows.forEach(function(r) {
    var type = String(r.type || "");
    var cls  = /高鐵/.test(type) ? "hsr" : (/遊覽|包車|巴士/.test(type) ? "bus" : "tra");
    var icon = (cls === "hsr") ? "🚄" : (cls === "bus") ? "🚌" : "🚆";

    // 備註若寫「第1段：礁溪 ▶ 南港」→ 段號自動變成標籤，其餘當路線
    var badge = "", route = String(r.note || "");
    var m = route.match(/^第\s*([0-9０-９一二三四五六])\s*段\s*[：:]\s*/);
    if (m) { badge = "第" + m[1] + "段"; route = route.slice(m[0].length); }

    html += "<div class='leg " + cls + "'>";

    // ① 段號（左上角，自成一行）
    if (badge) {
      html += "<div class='leg-badge-row'><span class='leg-badge'>" +
              escapeHtml(badge) + "</span></div>";
    }
    // ② 車種 + 車次
    html += "<div class='leg-type'>" + icon + " " + escapeHtml(type) +
            (r.no ? "　" + escapeHtml(r.no) + " 次" : "") + "</div>";

    if (r.dep || r.arr) {
      html += "<div class='leg-time'>" +
        escapeHtml(r.dep || "—") + " → " + escapeHtml(r.arr || "—") + "</div>";
    } else if (cls !== "bus") {
      html += "<div class='leg-tba'>⏳ 時間待通知</div>";
    }

    if (route) html += "<div class='leg-route'>" + escapeHtml(route) + "</div>";
    html += "</div>";
  });
  html += "</div>";
  return html;
}

// 接駁車卡片（黃車身 + 橘漩渦 + Q 版遊覽車底圖）
function renderShuttleCard(label, busNo, route) {
  if (!busNo) return "";
  var swirl =
    "<svg class='swirl' viewBox='0 0 540 130' preserveAspectRatio='none'>" +
      "<path d='M-20,70 C120,30 260,95 400,55 C470,35 510,55 560,45 L560,130 L-20,130 Z' fill='#fb8c00' opacity='0.8'/>" +
      "<path d='M-20,95 C120,60 260,120 400,82 C470,62 510,82 560,72 L560,130 L-20,130 Z' fill='#e65100' opacity='0.65'/>" +
      "<circle cx='60' cy='100' r='22' fill='none' stroke='#e65100' stroke-width='6' opacity='0.45'/>" +
      "<circle cx='60' cy='100' r='10' fill='none' stroke='#fb8c00' stroke-width='4' opacity='0.5'/>" +
    "</svg>";
  // Q 版遊覽車（右下角底圖，半透明）
  var busImg =

// 舊版 fallback：住宿（用 hotel1 / hotel2 欄位） + 同住者
function renderLegacyHotels(data, isTwoDay) {

function renderRoommates(raw) {
  raw = String(raw || "").trim();
  if (!raw || raw === "未填寫") {
    return "<span style='color:#7a5a3a'>未填寫</span>";
  }
  var names = raw.split(/[、,，\/／\s]+/).filter(function(s) { return s.trim(); });
  if (names.length === 0) return escapeHtml(raw);
  return names.map(function(n) {
    var safe = escapeAttr(n).replace(/'/g, "\\'");
    return "<span class='roommate-chip' onclick=\"searchAs('" + safe + "')\">" +
      escapeHtml(n) + "</span>";
  }).join(" ");
}

// ============== 渲染：車票 ==============
function renderTicket(t, dayLabelOrN, date) {
  if (!t.type && !t.no && !t.car && !t.seat) return "";

  var style = getTicketStyle(t.type);
  if (style === "bus") return renderBusTicket(t, dayLabelOrN, date);
  return renderTrainTicket(t, dayLabelOrN, date, style);
}

function renderTrainTicket(t, dayLabelOrN, date, style) {
  var icon = style === "hsr" ? "🚄" : "🚂";
  // 兼容數字（舊版）和字串（新版 D1/D2/D3自強/D3高鐵）
  var dayLabel = typeof dayLabelOrN === 'number'
    ? (["", "第一天", "第二天", "第三天"][dayLabelOrN] || '車票')
    : (dayLabelOrN || t.dayLabel || '車票');
  var fareTagClass = getFareTagClass(t.fare);
  var duration = calcDuration(t.fromTime, t.toTime);

  var stripe = "";
  if (style === "hsr") {
    stripe = "<svg class='full-stripe' viewBox='0 0 540 270' preserveAspectRatio='none'>" +
      "<path d='M560,30 C420,75 280,55 140,105 C70,130 25,125 -20,140 L-20,155 C25,140 70,140 140,120 C280,75 420,90 560,50 Z' fill='#9aa5b1' opacity='0.32'/>" +
      "<path d='M560,140 C420,185 280,170 140,215 C70,240 25,235 -20,245 L-20,270 L560,270 Z' fill='#e65100' opacity='0.62'/>" +
      "<path d='M560,195 C420,225 280,215 140,245 C70,260 25,260 -20,270 L-20,270 L560,270 Z' fill='#9aa5b1' opacity='0.22'/>" +
      "</svg>";
  } else {
    stripe = "<div class='corner'></div>";
  }

  var seatParts = [];
  if (showField("車廂") && t.car) seatParts.push(t.car + " 車");
  if (showField("座位") && t.seat) seatParts.push(t.seat + " 號");
  var seatInfo = seatParts.length ? seatParts.join(" ") + (style === "tra" ? " 對號座" : "") : "";

  var trainNoText = (t.no ? t.no + " 次" : "");
  var typeLine = icon + " " + (t.type || "") + (showField("車次") && trainNoText ? " " + trainNoText : "");

  var fareHtml = (showField("票種") && t.fare)
    ? "<span class='fare-tag " + fareTagClass + "'>" + escapeHtml(t.fare) + "</span>" : "";

  var fromTimeHtml = showField("出發時間") ? (t.fromTime || tba("待通知")) : "";
  var toTimeHtml = showField("抵達時間") ? (t.toTime || tba("待通知")) : "";
  var durationHtml = (showField("行駛時間") && duration)
    ? "<span class='duration'>⏱ " + escapeHtml(duration) + "</span>" : "";

  return "<div class='ticket " + style + "'>" +
    stripe +
    "<div class='head'>" +
      "<div class='head-left'>" +
        "<span class='date-line'>" + escapeHtml(date || "—") + " ‧ " + dayLabel + "</span>" +
        "<span class='type-line'>" + typeLine + "</span>" +
      "</div>" +
      fareHtml +
    "</div>" +
    "<div class='route-main'>" +
      "<div class='r-row'>" +
        "<span class='station-cn'>" + stationHtml_(t.from) + "</span>" +
        "<span class='arrow-big'>▶</span>" +
        "<span class='station-cn'>" + stationHtml_(t.to) + "</span>" +
      "</div>" +
      "<div class='r-row'>" +
        "<span class='time-val'>" + fromTimeHtml + "</span>" +
        "<span></span>" +
        "<span class='time-val'>" + toTimeHtml + "</span>" +
      "</div>" +
    "</div>" +
    "<div class='bottom'>" +
      "<span class='seat-info'>" + escapeHtml(seatInfo) + "</span>" +
      durationHtml +
    "</div>" +
  "</div>";
}

function renderBusTicket(t, dayLabelOrN, date) {
  var dayLabel = typeof dayLabelOrN === 'number'
    ? (["", "第一天", "第二天", "第三天"][dayLabelOrN] || '車票')
    : (dayLabelOrN || t.dayLabel || '車票');
  var duration = calcDuration(t.fromTime, t.toTime);

  var stops = [{ name: t.from, time: t.fromTime }];
  if (t.mid1) stops.push({ name: t.mid1, time: t.mid1Time });
  if (t.mid2) stops.push({ name: t.mid2, time: t.mid2Time });
  stops.push({ name: t.to, time: t.toTime });
  stops = stops.filter(function(s) { return s.name; });

  var stopsHtml = "";
  for (var i = 0; i < stops.length; i++) {
    if (i > 0) stopsHtml += "<span class='arrow-big'>▶</span>";
    var timeShow = stops[i].time && showField("出發時間") ? stops[i].time : "—";
    var tbaClass = (timeShow === "—") ? " tba" : "";
    stopsHtml += "<div class='stop'>" +
      "<div class='station-cn'>" + escapeHtml(stops[i].name) + "</div>" +
      "<div class='time-val" + tbaClass + "'>" + escapeHtml(timeShow) + "</div>" +
      "</div>";
  }

  var typeLine = "🚌 " + (t.type || "遊覽車") + (showField("車次") && t.no ? " " + t.no : "");
  var fareHtml = (showField("票種") && t.fare)
    ? "<span class='fare-tag'>" + escapeHtml(t.fare) + "</span>"
    : "<span class='fare-tag'>主辦安排</span>";
  var durationHtml = (showField("行駛時間") && duration)
    ? "<span class='duration'>⏱ " + escapeHtml(duration) + "</span>" : "";

  return "<div class='ticket bus'>" +
    "<div class='head'>" +
      "<div class='head-left'>" +
        "<span class='date-line'>" + escapeHtml(date || "—") + " ‧ " + dayLabel + "</span>" +
        "<span class='type-line'>" + typeLine + "</span>" +
      "</div>" +
      fareHtml +
    "</div>" +
    "<div class='route-main'>" +
      "<div class='bus-route'>" + stopsHtml + "</div>" +
    "</div>" +
    "<div class='bottom'>" +
      "<span class='seat-info'></span>" +
      durationHtml +
    "</div>" +
  "</div>";
}

// ============== 確認 / 留言 ==============
function confirmInfo() {
  if (!currentRecord) return;
  var btn = document.getElementById("confirmBtn");
  if (btn) { btn.disabled = true; btn.textContent = "送出中..."; }

  google.script.run.withSuccessHandler(function(response) {
    currentRecord.confirmed = "已確認";
    currentRecord.confirmTime = nowStr();
    renderRecord(currentRecord);
    appendNotice("✅ 已成功確認資料，謝謝您！");
  }).withFailureHandler(function(err) {
    if (btn) { btn.disabled = false; btn.textContent = "✅ 我已確認以上資訊"; }
    appendNotice("⚠ 確認失敗：" + (err.message || err));
  }).confirmUser(currentRecord.name, currentRecord.days, currentRecord.roommates);
}

function sendMessage() {
  if (!currentRecord) return;
  var ta = document.getElementById("guestMessage");
  var btn = document.getElementById("msgBtn");
  var message = ta.value.trim();
  if (message === "") {
    appendNotice("請先輸入留言內容喔");
    return;
  }
  ta.disabled = true; btn.disabled = true; btn.textContent = "送出中...";

  google.script.run.withSuccessHandler(function(response) {
    currentRecord.lastMessage = message;
    currentRecord.lastMessageTime = nowStr();
    renderRecord(currentRecord);
    appendNotice("✅ 留言已送出，主辦會在後台看到喔！");
  }).withFailureHandler(function(err) {
    ta.disabled = false; btn.disabled = false; btn.textContent = "送出留言";
    appendNotice("⚠ 留言失敗：" + (err.message || err));
  }).saveMessage(currentRecord.name, currentRecord.days, currentRecord.roommates, message);
}

function appendNotice(text) {
  var div = document.createElement("div");
  div.className = "notice";
  div.textContent = text;
  document.getElementById("result").appendChild(div);
}

function nowStr() {
  var d = new Date();
  var pad = function(n) { return n < 10 ? "0" + n : n; };
  return pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " +
    pad(d.getHours()) + ":" + pad(d.getMinutes());
}

// 查詢缺人的房間（三層導覽：夜→飯店→房型→房間）
var ROOMS_DATA = null;

// 重新查詢：清空結果、恢復房間按鈕、聚焦輸入框
function resetSearch() {
  document.getElementById("result").innerHTML = "";
  document.getElementById("name").value = "";
  var roomsArea = document.getElementById("roomsBtnArea");
  if (roomsArea) roomsArea.style.display = "";
  var pBox = document.getElementById("progressBox");
  if (pBox) pBox.style.display = "";
  document.getElementById("name").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function findRooms(daysFilter) {
  var pBox = document.getElementById("progressBox");
  if (pBox) pBox.style.display = "none";
  document.getElementById("result").innerHTML =
    "<div class='notice'><span class='spinner'></span>查詢中，請稍候...</div>";

  google.script.run.withSuccessHandler(function(data) {
    if (!data || data.error) {
      document.getElementById("result").innerHTML =
        "<div class='notice'>⚠ " + escapeHtml((data && data.error) || "查無資料") + "</div>";
      return;
    }
    ROOMS_DATA = data;
    showHotelList();
  }).withFailureHandler(function(err) {
    document.getElementById("result").innerHTML =
      "<div class='notice'>⚠ 查詢失敗：" + escapeHtml(err.message || err) + "</div>";
  }).findIncompleteRooms(daysFilter || null);
}

// 把「碧海藍天-兩人房」拆成 {hotel: "碧海藍天", type: "兩人房"}
function splitHotelType(s) {
  s = String(s || "");
  var m = s.match(/^(.+?)[-‐](.+)$/);
  if (m) return { hotel: m[1].trim(), type: m[2].trim() };
  var m2 = s.match(/^(.+?)((?:兩人|雙人|四人|三人|六人|\d人)房.*)$/);
  if (m2) return { hotel: m2[1].trim(), type: m2[2].trim() };
  return { hotel: s, type: '' };
}

function groupByHotel(rooms) {
  var byHotel = {};
  rooms.forEach(function(r) {
    var split = splitHotelType(r.hotel);
    var h = split.hotel;
    var t = split.type || '房型';
    if (!byHotel[h]) byHotel[h] = {};
    if (!byHotel[h][t]) byHotel[h][t] = [];
    byHotel[h][t].push(r);
  });
  return byHotel;
}

// Step 1：列出兩夜的飯店
function showHotelList() {
  var filterLabel = '';
  if (ROOMS_DATA && ROOMS_DATA.daysFilter) {
    filterLabel = '（' + escapeHtml(ROOMS_DATA.daysFilter) + '）';
  }
  var html = "<div class='card'>" +
    "<div class='name-title'>🛏 缺人的房間" + filterLabel + "</div>";

  ['d1', 'd2'].forEach(function(night) {
    var nightLabel = (night === 'd1') ? '🌊 第一夜' : '🌿 第二夜';
    var rooms = ROOMS_DATA[night] || [];
    html += "<div class='section-title'>" + nightLabel + "</div>";

    if (rooms.length === 0) {
      html += "<div class='notice' style='background:#d1fae5;color:#065f46'>✅ 所有房間都已滿房</div>";
      return;
    }

    var byHotel = groupByHotel(rooms);
    // 排序：碧海 → 慈惠堂 → 長榮 → 其他
    var hotelKeys = Object.keys(byHotel).sort(function(a, b) {
      var pa = /碧海|藍天/.test(a) ? 1 : /慈惠|聖地/.test(a) ? 2 : /長榮|鳳凰/.test(a) ? 3 : 99;
      var pb = /碧海|藍天/.test(b) ? 1 : /慈惠|聖地/.test(b) ? 2 : /長榮|鳳凰/.test(b) ? 3 : 99;
      return pa - pb;
    });
    html += "<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px'>";
    hotelKeys.forEach(function(hotel) {
      var totalRooms = 0;
      Object.keys(byHotel[hotel]).forEach(function(t) {
        totalRooms += byHotel[hotel][t].length;
      });
      var hotelEsc = escapeAttr(hotel).replace(/'/g, "\\'");
      html += "<button class='hotel-btn' onclick=\"showHotel('" + night + "', '" + hotelEsc + "')\">" +
        "<span class='label'>🏨 " + escapeHtml(hotel) + "</span>" +
        "<span class='count'>缺 " + totalRooms + " 房</span>" +
        "<span class='arrow'>→</span>" +
        "</button>";
    });
    html += "</div>";
  });

  html += "</div>";
  document.getElementById("result").innerHTML = html;
}

// Step 2：點某飯店 → 顯示房型
function showHotel(night, hotel) {
  var rooms = ROOMS_DATA[night] || [];
  var byHotel = groupByHotel(rooms);
  var types = byHotel[hotel] || {};
  var nightLabel = (night === 'd1') ? '🌊 第一夜' : '🌿 第二夜';

  var html = "<div class='card'>" +
    "<div class='name-title'>" + nightLabel + " ‧ " + escapeHtml(hotel) + "</div>" +
    "<button class='back-btn' onclick='showHotelList()'>← 回飯店列表</button>";

  if (Object.keys(types).length === 0) {
    html += "<div class='notice'>所有房間都已滿</div>";
  } else {
    // 房型排序：兩人房 → 四人房 → 其他
    var typeKeys = Object.keys(types).sort(function(a, b) {
      var sa = /兩人|雙人|2\s*人/.test(a) ? 2 : /三人|3\s*人/.test(a) ? 3 : /四人|4\s*人/.test(a) ? 4 : 99;
      var sb = /兩人|雙人|2\s*人/.test(b) ? 2 : /三人|3\s*人/.test(b) ? 3 : /四人|4\s*人/.test(b) ? 4 : 99;
      return sa - sb;
    });
    html += "<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px'>";
    typeKeys.forEach(function(t) {
      var count = types[t].length;
      var hotelEsc = escapeAttr(hotel).replace(/'/g, "\\'");
      var tEsc = escapeAttr(t).replace(/'/g, "\\'");
      html += "<button class='roomtype-btn' onclick=\"showRooms('" + night + "', '" + hotelEsc + "', '" + tEsc + "')\">" +
        "<span class='label'>🛏 " + escapeHtml(t) + "</span>" +
        "<span class='count'>缺 " + count + " 間</span>" +
        "<span class='arrow'>→</span>" +
        "</button>";
    });
    html += "</div>";
  }

  html += "</div>";
  document.getElementById("result").innerHTML = html;
}

// Step 3：點某房型 → 顯示缺人房間
function showRooms(night, hotel, type) {
  var rooms = ROOMS_DATA[night] || [];
  var byHotel = groupByHotel(rooms);
  var roomList = (byHotel[hotel] && byHotel[hotel][type]) || [];
  var nightLabel = (night === 'd1') ? '🌊 第一夜' : '🌿 第二夜';
  var hotelEsc = escapeAttr(hotel).replace(/'/g, "\\'");

  var html = "<div class='card'>" +
    "<div class='name-title'>" + nightLabel + " ‧ " + escapeHtml(hotel) + " ‧ " + escapeHtml(type) + "</div>" +
    "<button class='back-btn' onclick=\"showHotel('" + night + "', '" + hotelEsc + "')\">← 回 " + escapeHtml(hotel) + " 房型</button>";

  if (roomList.length === 0) {
    html += "<div class='notice'>✅ 都滿了</div>";
  } else {
    roomList.forEach(function(r, idx) {
      var filled = r.capacity - r.missing;
      html += "<div class='room-incomplete'>" +
        "<div class='h-name'>🏠 第 " + (idx + 1) + " 間</div>" +
        "<div class='members'>已住 " + filled + " 人：" +
          escapeHtml(r.members.join(" ‧ ") || "（空房）") +
          "</div>" +
        "<div class='missing'>還缺 " + r.missing + " 人</div>" +
        "</div>";
    });
  }

  html += "</div>";
  document.getElementById("result").innerHTML = html;
}

// 留言整個區塊摺疊展開
function toggleMessage() {
  var b = document.getElementById("messageBlock");
  if (!b) return;
  b.style.display = (b.style.display === "none") ? "block" : "none";
}

document.getElementById("name").addEventListener("keydown", function(e) {
  if (e.key === "Enter") search();
});

// 進入頁面就載入進度公告
loadProgress();

</script>
